{% extends "base.html" %}
{% block title %}Log in — SatsFlow{% endblock %}
{% block content %}

<section class="auth-wrap">
    <div class="auth-card">
        <h1>Log in</h1>
        <p class="muted small">Welcome back.</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/login">
            <label class="field">
                <span class="field-label">Handle</span>
                <input type="text" class="input" name="slug" required autofocus>
            </label>

            <label class="field">
                <span class="field-label">Password</span>
                <input type="password" class="input" name="password" required>
            </label>

            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <p class="muted small center" style="margin-top: 16px;">
            New here? <a href="/auth/signup">Create an account</a>
        </p>
    </div>
</section>

{% endblock %}
