<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SatsFlow{% endblock %}</title>
    <meta name="description" content="Non-custodial Bitcoin and Monero donations.">
    <link rel="icon" href="{{ url_for('static', path='img/logo.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

    <script src="{{ url_for('static', path='js/theme.js') }}" defer></script>
