{% set me = session_creator(request) if request else None %}
<header class="site-nav">
    <div class="nav-inner">
        <a href="/" class="nav-brand">
            <img src="{{ url_for('static', path='img/logo.svg') }}" alt="" width="26" height="26">
            <span>SatsFlow</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="{% if active == 'home' %}is-active{% endif %}">Home</a>
            <a href="/c/kayakcrasher" class="{% if active == 'creator' %}is-active{% endif %}">Demo</a>
            <a href="/c/kayakcrasher/live">Live</a>
            <a href="/dashboard" class="{% if active == 'dashboard' %}is-active{% endif %}">Dashboard</a>
            {% if me %}
            <form method="post" action="/auth/logout" style="display:inline;">
                <button type="submit" class="nav-link-btn">Log out</button>
            </form>
            {% else %}
            <a href="/auth/login" class="{% if active == 'login' %}is-active{% endif %}">Log in</a>
            <a href="/auth/signup" class="nav-cta">Sign up</a>
            {% endif %}
        </nav>
        <button class="theme-toggle" type="button">
            <span class="theme-toggle-dot"></span>
        </button>
    </div>
</header>
